{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <h2><i class="fas fa-book"></i> Study Materials</h2>
    
    <div class="card mb-4">
        <div class="card-body">
            <form method="GET" class="row g-3">
                <div class="col-md-10">
                    <select class="form-select" name="subject">
                        <option value="">All Subjects</option>
                        {% for subj in subjects %}
                        <option value="{{ subj.subject }}" {% if request.args.get('subject') == subj.subject %}selected{% endif %}>
                            {{ subj.subject }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-filter"></i> Filter
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="row">
        {% for material in materials %}
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <div class="text-center mb-3">
                        <i class="fas fa-file-pdf fa-4x text-danger"></i>
                    </div>
                    <h5 class="card-title">{{ material.title }}</h5>
                    <p class="text-muted">
                        <i class="fas fa-user"></i> {{ material.teacher_name }}<br>
                        <i class="fas fa-book"></i> {{ material.subject }}
                    </p>
                    <a href="{{ url_for('static', filename=material.file) }}" 
                       class="btn btn-primary w-100" download>
                        <i class="fas fa-download"></i> Download
                    </a>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12">
            <div class="alert alert-info">No study materials found.</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
