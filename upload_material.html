{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <h2><i class="fas fa-upload"></i> Upload Study Material</h2>
    
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label">Material Title</label>
                            <input type="text" class="form-control" id="title" name="title" 
                                   placeholder="e.g., Algebra Chapter 5 Notes" required>
                        </div>

                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <select class="form-select" id="subject" name="subject" required>
                                <option value="">Select Subject</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="Physics">Physics</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="Biology">Biology</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="English">English</option>
                                <option value="History">History</option>
                                <option value="Geography">Geography</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="file" class="form-label">Upload File (PDF)</label>
                            <input type="file" class="form-control" id="file" name="file" 
                                   accept=".pdf" required>
                            <small class="text-muted">Maximum file size: 16MB</small>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-upload"></i> Upload Material
                        </button>
                        <a href="{{ url_for('teacher_dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-light">
                <div class="card-body">
                    <h5><i class="fas fa-info-circle"></i> Guidelines</h5>
                    <ul class="small">
                        <li>Upload PDF files only</li>
                        <li>Use clear, descriptive titles</li>
                        <li>Select the correct subject</li>
                        <li>Ensure content is educational</li>
                        <li>Maximum file size: 16MB</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
